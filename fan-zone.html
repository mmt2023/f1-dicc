*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root{

body{

  /* ── NAV ── */
  nav {
    position: sticky; top: 0; z-index: 200;
    background: #0d0d0d;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2.5rem; height: 100px;
    border-bottom: 1px solid #222;
  }
  .nav-links { display: flex; gap: 2rem; align-items: center; }
  .nav-links a {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 0.85rem; letter-spacing: 0.08em; text-decoration: none;
    text-transform: uppercase; position: relative; transition: opacity 0.2s;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -4px; left: 0;
    width: 0; height: 2px; background: currentColor; transition: width 0.25s ease;
  }
  .nav-links a:hover::after { width: 100%; }
  .nav-links a:hover { opacity: 0.8; }
  .nav-links a.red   { color: var(--red); }
  .nav-links a.white { color: #fff; }
  .nav-links a.green { color: var(--green); }
  .nav-links a.blue  { color: var(--blue); }
  .nav-links a.pink  { color: #ff6ec7; }
  .nav-links a.orange  { color: #ff7801; }

  .nav-item { position: relative; display: inline-block; }
  .dropdown {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    background: #111; padding: 1rem 2rem; display: flex; flex-direction: column;
    gap: 0.8rem; opacity: 0; visibility: hidden; transition: 0.3s ease; z-index: 300;
  }
  .dropdown a {
    color: var(--blue); text-decoration: none;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.8rem; transition: color 0.2s;
  }
  .dropdown a:hover { color: #fff; }
  .nav-item:hover .dropdown { opacity: 1; visibility: visible; }
  .dropdown-fia a { color: var(--green); }
  .dropdown-fia a:hover { color: #fff; }

  .nav-right { display: flex; align-items: center; gap: 0.6rem; }
  .nav-right img { height: 100px; width: auto; display: block; object-fit: contain; }
  .nav-right a {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.8rem;
    letter-spacing: 0.12em; text-transform: uppercase; color: #fff;
    text-decoration: underline; display: flex; align-items: center; gap: 0.4rem;
  }
